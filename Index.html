<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Ganhos</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f4f7;color:#222}
header{background:#111827;color:white;padding:20px;text-align:center}
header h1{margin:0;font-size:24px}
.container{max-width:500px;margin:auto;padding:15px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
label{display:block;margin-top:12px;font-weight:bold}
input{width:100%;padding:13px;margin-top:6px;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:15px;margin-top:18px;border:0;border-radius:9px;background:#16a34a;color:white;font-size:17px;font-weight:bold}
.resultado{font-size:18px;line-height:1.8}
.destaque{font-size:25px;font-weight:bold;color:#16a34a}
.alerta{color:#dc2626;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🚗 Calculadora de Ganhos</h1>
<p>Controle suas corridas</p>
</header>

<div class="container">

<div class="card">

<label>Faturamento bruto (R$)</label>
<input type="number" id="faturamento" placeholder="Ex: 200">

<label>Quilômetros rodados</label>
<input type="number" id="km" placeholder="Ex: 150">

<label>Horas trabalhadas</label>
<input type="number" id="horas" placeholder="Ex: 6">

<label>Preço da gasolina (R$/L)</label>
<input type="number" id="gasolina" placeholder="Ex: 6.95">

<label>Consumo do carro (km/L)</label>
<input type="number" id="consumo" placeholder="Ex: 10">

<button onclick="calcular()">CALCULAR GANHOS</button>

</div>

<div class="card resultado" id="resultado">
Preencha os dados acima para calcular.
</div>

</div>

<script>
function calcular(){

let faturamento=Number(document.getElementById("faturamento").value);
let km=Number(document.getElementById("km").value);
let horas=Number(document.getElementById("horas").value);
let gasolina=Number(document.getElementById("gasolina").value);
let consumo=Number(document.getElementById("consumo").value);

if(!faturamento||!km||!horas||!gasolina||!consumo){
document.getElementById("resultado").innerHTML=
"<span class='alerta'>Preencha todos os campos.</span>";
return;
}

let litros=km/consumo;
let gastoCombustivel=litros*gasolina;
let lucro=faturamento-gastoCombustivel;
let ganhoHora=lucro/horas;
let ganhoKm=lucro/km;

document.getElementById("resultado").innerHTML=`
<strong>📊 Resultado</strong><br><br>

Faturamento bruto:<br>
<strong>R$ ${faturamento.toFixed(2)}</strong><br><br>

Combustível utilizado:<br>
<strong>${litros.toFixed(2)} litros</strong><br><br>

Gasto com combustível:<br>
<strong>R$ ${gastoCombustivel.toFixed(2)}</strong><br><br>

<hr>

Lucro após combustível:<br>
<span class="destaque">R$ ${lucro.toFixed(2)}</span><br><br>

Ganho líquido por hora:<br>
<strong>R$ ${ganhoHora.toFixed(2)}/hora</strong><br><br>

Ganho líquido por km:<br>
<strong>R$ ${ganhoKm.toFixed(2)}/km</strong>
`;
}
</script>

</body>
</html>
